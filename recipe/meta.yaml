{% set version = "0.3.5" %}
{% set arm_variant_type = "sbsa" %}

package:
  name: libnvpl-common-dev
  version: {{ version }}

source:
  url: https://developer.download.nvidia.com/compute/nvpl/redist/nvpl_common/linux-sbsa/nvpl_common-linux-sbsa-{{ version }}-archive.tar.xz
  sha256: 346d2137620114e7692bb78855a585d24bad300d77522f0f161e8c6e439c62e1

build:
  number: 0
  # 'technically' noarch (ships only cmake config text files), but its host
  # dep _nvpl_dev_mutex is published as a linux-aarch64 package on pkgs/main,
  # so a noarch build (which PBP runs on linux-64) could not resolve it.
  # Built as a linux-aarch64 package with 'skip' instead — matches the rest
  # of the NVPL chain and the cuda-runtime-feedstock convention.
  skip: true  # [not (linux and aarch64)]
  script:
    - cp -rv lib $PREFIX

requirements:
  host:
    - _nvpl_dev_mutex
  run:
    - {{ pin_compatible('_nvpl_dev_mutex', exact=True) }}
    - __unix

test:
  commands:
    - test -f $PREFIX/lib/cmake/nvpl/nvpl-config.cmake
    - test -f $PREFIX/lib/cmake/nvpl_common/nvpl_common-config.cmake

about:
  home: https://developer.nvidia.com/nvpl
  license: LicenseRef-NVIDIA-End-User-License-Agreement
  license_family: Other
  license_file: LICENSE
  license_url: https://docs.nvidia.com/nvpl/latest/license.html
  summary: >-
    The NVIDIA Performance Libraries (NVPL) are a collection of high performance mathematical libraries optimized for the NVIDIA Grace Armv9.0 architecture.
  description: >-
    The NVIDIA Performance Libraries (NVPL) are a collection of high performance mathematical libraries optimized for the NVIDIA Grace Armv9.0 architecture.

    These CPU-only libraries have no dependencies on CUDA or CTK, and are drop in replacements for standard C and Fortran mathematical APIs allowing HPC applications to achieve maximum performance on the Grace platform.
  doc_url: https://docs.nvidia.com/nvpl/
  dev_url: https://developer.nvidia.com/nvpl

extra:
  skip-lints:
    # license_url is kept on all Nvidia feedstocks per team convention
    - deprecate_license_url
  feedstock-name: libnvpl-common
  recipe-maintainers:
    - conda-forge/cuda
